  var SPECS={"plaketak": {"eu": ["15 × 21 cm", "300 aleko edizioa, eskuz egina", "Argazkiak Euskal Herrian eginak", "Prezioa: 30 €"], "es": ["15 × 21 cm", "Edición de 300 ejemplares hechos a mano", "Fotografías realizadas en Euskal Herria", "Precio: 30 €"], "en": ["15 × 21 cm", "Edition of 300 handmade copies", "Photographs taken in Euskal Herria (the Basque Country)", "Price: €30"], "fr": ["15 × 21 cm", "Édition de 300 exemplaires faits main", "Photographies réalisées en Euskal Herria (Pays basque)", "Prix : 30 €"]}, "inularre": {"eu": ["25 × 23 cm", "34 aleko edizio mugatua", "Fine art inprimagailuan inprimatua, Hahnemühle Sumi-e paperean", "Argazkiak Leonen eginak, 2026ko udan", "Prezioa: 80 €"], "es": ["25 × 23 cm", "Edición limitada de 34 ejemplares", "Impreso en impresora fine art sobre papel Hahnemühle Sumi-e", "Fotografías realizadas en León, en el verano de 2026", "Precio: 80 €"], "en": ["25 × 23 cm", "Limited edition of 34 copies", "Fine art printed on Hahnemühle Sumi-e paper", "Photographs taken in León, summer 2026", "Price: €80"], "fr": ["25 × 23 cm", "Édition limitée à 34 exemplaires", "Impression fine art sur papier Hahnemühle Sumi-e", "Photographies réalisées à León, été 2026", "Prix : 80 €"]}, "paulhe-i": {"eu": ["Prezioa: 40 €"], "es": ["Precio: 40 €"], "en": ["Price: €40"], "fr": ["Prix : 40 €"]}};
  var DESC={"inularre": {"eu": ["Bidaia bat, argazki lapurtuak eta maitasuna.", "Argazki liburu hau ez da opor batzuen kronika geografiko bat, bizitakoaren lekuko intimoa baizik. Kamerak, subjetuak ohartu gabe, haien egia biluziak eta keinu zaurgarriak harrapatu zituen, espazioa babesleku bihurtuz. Isiltasun berean topo egiten duten bi izate primitibo eta basati.", "Irudi lapurtu hauen azpian ardatz isil bat dago: maitasun gutun bat, maitatzea, norbaitek nola begiratzen zaituen ikastea ere badelako."], "es": ["Un viaje, fotografías robadas y amor.", "Este libro de fotografía no es una crónica geográfica de unas vacaciones, sino un testimonio íntimo de lo vivido. Sin que sus protagonistas se dieran cuenta, la cámara captó su verdad desnuda y sus gestos vulnerables, y convirtió el espacio en un refugio. Dos seres primitivos y salvajes que se encuentran en un mismo silencio.", "Bajo estas imágenes robadas late un eje silencioso: una carta de amor, porque amar también es aprender cómo te mira alguien."], "en": ["A journey, stolen photographs and love.", "This photobook is not the geographical chronicle of a holiday, but an intimate record of what was lived. Unnoticed by its subjects, the camera caught their naked truth and vulnerable gestures, turning the space into a refuge. Two primitive, wild beings meeting in the same silence.", "Beneath these stolen images runs a quiet thread: a love letter, because to love is also to learn how someone looks at you."], "fr": ["Un voyage, des photographies volées et de l’amour.", "Ce livre de photographies n’est pas la chronique géographique de vacances, mais le témoignage intime de ce qui a été vécu. À l’insu de ses sujets, l’appareil a saisi leur vérité nue et leurs gestes vulnérables, faisant de l’espace un refuge. Deux êtres primitifs et sauvages qui se rencontrent dans un même silence.", "Sous ces images volées court un fil silencieux : une lettre d’amour, car aimer, c’est aussi apprendre comment quelqu’un vous regarde."]}};
  DESC["paulhe-i"]={"eu":["Deskriba al dezakegu mendia zientziaz eta arteaz, filosofiaz eta poesiaz, arrazoiz eta emozioz?"],"es":["¿Podemos describir la montaña con ciencia y arte, con filosofía y poesía, con razón y emoción?"],"en":["Can we describe the mountain with science and art, with philosophy and poetry, with reason and emotion?"],"fr":["Pouvons-nous décrire la montagne par la science et l’art, la philosophie et la poésie, la raison et l’émotion ?"]};
  DESC.hiru={"eu": ["Myriam Pérez Cazabón dantza garaikideko koreografo eta dantzariarekin egindako elkarlana."], "es": ["Colaboración con la coreógrafa y bailarina de danza contemporánea Myriam Pérez Cazabón."], "en": ["A collaboration with contemporary dance choreographer and dancer Myriam Pérez Cazabón."], "fr": ["Une collaboration avec la chorégraphe et danseuse de danse contemporaine Myriam Pérez Cazabón."]};
  DESC.plaketak={"eu": ["Erantzunen bilaketa da lan honen abiapuntua.", "Nola txukundu memoria? Nola eraiki gure oinak helduko dituen lurra? Nola babestu zauriak oroitzapenekiko sarbiderik ez dugunean? Memoria irudikatuz? Ukitu ezin ditugun oroitzapenak marraztuz agian?", "Helduleku izan nahi duen liburua."], "es": ["La búsqueda de respuestas es el punto de partida de este trabajo.", "¿Cómo ordenar la memoria? ¿Cómo construir un suelo que sostenga nuestros pies? ¿Cómo proteger las heridas cuando los recuerdos nos resultan inaccesibles? ¿Dando imagen a la memoria? ¿Dibujando, quizá, los recuerdos que no podemos tocar?", "Un libro que quiere ser un asidero."], "en": ["The search for answers is the starting point of this work.", "How do we put memory in order? How do we build ground firm enough to hold our feet? How do we protect our wounds when our memories are out of reach? By giving memory an image? Perhaps by drawing the memories we cannot touch?", "A book meant to be something to hold on to."], "fr": ["La recherche de réponses est le point de départ de ce travail.", "Comment mettre de l’ordre dans la mémoire ? Comment bâtir un sol qui soutienne nos pas ? Comment protéger les blessures lorsque les souvenirs nous sont inaccessibles ? En donnant une image à la mémoire ? En dessinant peut-être les souvenirs que nous ne pouvons pas toucher ?", "Un livre qui veut être un point d’appui."]};

    {id:"hiru",year:2022,order:false,yearOnly:true,cover:2,video:"hiru.mp4",poster:"hiru-poster.jpg",vcap:{"eu": "Soinua: Ainara LeGardon", "es": "Sonido: Ainara LeGardon", "en": "Sound: Ainara LeGardon", "fr": "Son : Ainara LeGardon"}},
    {id:"plaketak",year:2020,pages:48,fmt:"18 × 24 cm",order:true,yearOnly:true,cover:2,video:"plaketak.mp4",poster:"plaketak-poster.jpg"}
  ];
  var views=["inicio","bio","contacto"].concat(works.map(function(w){return w.id;}));
  var lang="eu",typedDone=false,typing=null;
  try{var s=localStorage.getItem("lang");if(s&&L[s])lang=s;}catch(e){}

  function current(){var h=(location.hash||"").slice(1);return views.indexOf(h)<0?"inicio":h;}

  function buildNav(){
    var t=L[lang],h=current();
    function link(id,label){return '<a href="#'+id+'" data-view="'+id+'"'+(id===h?' aria-current="page"':'')+'>'+label+'</a>';}
    document.getElementById("navWorks").innerHTML=works.map(function(w,i){return link(w.id,t.titles[i]);}).join("");
    document.getElementById("navPages").innerHTML=link("bio",t.bio)+link("contacto",t.contact);
    document.querySelectorAll("#langs button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-lang")===lang?"true":"false");});
    document.documentElement.lang=lang;
  }

  function typeLead(text){
    var out=document.getElementById("typed"),cur=document.getElementById("cursor");
    if(!out)return;
    if(typedDone||window.matchMedia("(prefers-reduced-motion: reduce)").matches){out.textContent=text;cur.className="cursor done";typedDone=true;return;}
    typedDone=true;var i=0;
    (function step(){
      if(!document.getElementById("typed"))return;
      document.getElementById("typed").textContent=text.slice(0,++i);
      if(i<text.length){typing=setTimeout(step,45+Math.random()*60);}
      else{typing=setTimeout(function(){var c=document.getElementById("cursor");if(c)c.className="cursor done";},1500);}
    })();
  }

  function draw(){
    var t=L[lang],h=current(),el=document.getElementById("content"),html="";
    clearTimeout(typing);
    if(h==="inicio"){
      html='<p class="lead">'+t.lead+'</p>'+
           '<div class="hero">'+[0].map(function(k){return '<div class="pair">'+HERO.slice(k,k+2).map(function(x){return '<img src="'+x.src+'" alt="'+x.alt[lang]+'">';}).join('')+'</div>';}).join('')+'</div>';
    }else if(h==="bio"){
      html='<h2>'+t.bio+'</h2><div class="meta"></div><img class="selfie" src="autorretrato.webp" alt="'+t.self+'"><p>'+t.b1+'</p><p>'+t.b3+'</p><p>'+t.b2+'</p><dl>'+works.map(function(w,i){return '<dt>'+w.year+'</dt><dd><a href="#'+w.id+'">'+t.titles[i]+'</a></dd>';}).join('')+'</dl>';
    }else if(h==="contacto"){
      html='<p><a class="mail" target="_blank" rel="noopener" href="mailto:aorkolaga@gmail.com">aorkolaga@gmail.com</a></p>';
    }else{
      var i=views.indexOf(h)-3,w=works[i],title=t.titles[i],im=IMGS[w.id],first=im?'<img class="ph first'+(im[0].land?' land':'')+(im[0].sq?' sq':'')+'" src="'+im[0].src+'" alt="'+im[0].alt[lang]+'">':'<div class="ph wide" aria-hidden="true">'+t.pic+'</div>';
      var extra="",n=4,k,d=DESC[w.id]&&(DESC[w.id][lang]||DESC[w.id].eu),desc=d?'<p><strong>'+d[0]+'</strong></p>'+d.slice(1).map(function(x){return '<p>'+x+'</p>';}).join(''):'';
      if(im){for(k=1;k<im.length;k++){var q=im[k].pg;extra+=q?'<div class="pg"'+(q.r?' style="--r:'+q.r+'"':'')+'><img loading="lazy" src="'+im[k].src+'" alt="'+im[k].alt[lang]+'" style="left:'+q.x+'%;top:'+q.y+'%;width:'+q.w+'%;height:'+q.h+'%"></div>':'<img loading="lazy" class="ph img'+(im[k].land?' land':'')+(im[k].sq?' sq':'')+(im[k].half?' half':'')+'" src="'+im[k].src+'" alt="'+im[k].alt[lang]+'">';}n=Math.max(0,4-(im.length-1));}
      for(k=0;k<n;k++){extra+='<div class="ph tall" aria-hidden="true"></div>';}
      var meta='<div class="meta specs">'+(w.yearOnly?w.year:w.year+', '+w.pages+' '+t.pages+', '+w.fmt+(w.order?'':', '+t.soldout))+(SPECS[w.id]?'<br>'+SPECS[w.id][lang].join('<br>'):'')+'</div>';
      html='<h2>'+title+'</h2>'+desc+
           (im?'<button type="button" class="cover"><img src="'+(w.coverImg||im[w.cover||0]).src+'" alt="'+(w.coverImg||im[w.cover||0]).alt[lang]+'"><span class="cv">'+t.view+' ('+im.length+') →</span></button>':'')+'<div class="gwrap'+(im?' closed':'')+'"><div class="grid" role="region" tabindex="0" aria-label="'+title+'">'+first+extra+'</div><button type="button" class="arr l" aria-label="←"><svg viewBox="0 0 36 16"><path d="M35 8H1M8 1L1 8l7 7"/></svg></button><button type="button" class="arr r" aria-label="→"><svg viewBox="0 0 36 16"><path d="M1 8h34M28 1l7 7-7 7"/></svg></button></div>'+
           (w.video?'<p class="links"><button type="button" class="vlink">'+t.vid+' ▶</button></p>':'')+meta+(w.order?'<a class="order" target="_blank" rel="noopener" href="mailto:aitziber@puntu.eus?subject='+encodeURIComponent(title)+'">'+t.order+'</a>':'');
    }
    el.innerHTML=html;
    var pt=h==="inicio"?"":h==="bio"?t.bio:h==="contacto"?t.contact:t.titles[views.indexOf(h)-3];
    document.title=pt?pt+" — Aitziber Orkolaga":"Aitziber Orkolaga";

    var g=el.querySelector(".grid");if(g){var wr=g.parentNode,bl=wr.querySelector(".arr.l"),br=wr.querySelector(".arr.r"),mt=null;
      function upd(){bl.hidden=g.scrollLeft<4;br.hidden=g.scrollLeft+g.clientWidth>=g.scrollWidth-4;}
      function step(d){var it=g.firstElementChild;g.scrollBy({left:d*(it?it.getBoundingClientRect().width+12:g.clientWidth/3),behavior:"smooth"});}
      bl.addEventListener("click",function(){step(-1);});br.addEventListener("click",function(){step(1);});
      g.addEventListener("scroll",function(){upd();wr.classList.add("moving");clearTimeout(mt);mt=setTimeout(function(){wr.classList.remove("moving");},800);},{passive:true});
      upd();var cv=el.querySelector('.cover');if(cv)cv.addEventListener('click',function(){cv.hidden=true;wr.classList.remove('closed');g.scrollLeft=0;upd();try{wr.scrollIntoView({block:'nearest'});}catch(x){}});}
  }

  function route(scroll){buildNav();draw();if(scroll)window.scrollTo(0,0);}

  window.addEventListener("hashchange",function(){route(true);});
  document.getElementById("langs").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    lang=b.getAttribute("data-lang");
    try{localStorage.setItem("lang",lang);}catch(err){}
    route(false);
  });
  var lb=document.getElementById("lb"),lbImg=document.getElementById("lbImg"),set=[],cur=0,last=null;
  function show(i){cur=(i+set.length)%set.length;lbImg.src=set[cur].src;lbImg.alt=set[cur].alt;document.getElementById("lbCount").textContent=(cur+1)+" / "+set.length;
    var multi=set.length>1;document.getElementById("lbPrev").style.display=multi?"":"none";document.getElementById("lbNext").style.display=multi?"":"none";}
  function openLb(img){var box=img.closest(".grid,.hero")||img.parentNode;set=[].slice.call(box.querySelectorAll("img"));last=img;lb.classList.add("open");document.body.style.overflow="hidden";show(set.indexOf(img));document.getElementById("lbX").focus();}
  function closeLb(){lb.classList.remove("open");document.body.style.overflow="";lbImg.removeAttribute("src");if(last)last.focus&&last.focus();}
  document.getElementById("content").addEventListener("click",function(e){var im=e.target.closest("img");if(im&&!im.closest(".cover"))openLb(im);});
  document.getElementById("lbX").addEventListener("click",closeLb);
  document.getElementById("lbPrev").addEventListener("click",function(e){e.stopPropagation();show(cur-1);});
  document.getElementById("lbNext").addEventListener("click",function(e){e.stopPropagation();show(cur+1);});
  lb.addEventListener("click",function(e){if(e.target===lb||e.target===lbImg)closeLb();});
  document.addEventListener("keydown",function(e){if(!lb.classList.contains("open"))return;if(e.key==="Escape")closeLb();else if(e.key==="ArrowLeft")show(cur-1);else if(e.key==="ArrowRight")show(cur+1);});
  var tx=null;lb.addEventListener("touchstart",function(e){tx=e.touches[0].clientX;},{passive:true});
  lb.addEventListener("touchend",function(e){if(tx===null)return;var d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>50&&set.length>1){e.preventDefault();show(cur+(d<0?1:-1));}});
  window.addEventListener("hashchange",function(){if(lb.classList.contains("open"))closeLb();});
  var COPIED={eu:"kopiatuta",en:"copied",es:"copiado",fr:"copié"};
  document.getElementById("content").addEventListener("click",function(e){var m=e.target.closest("a.mail");if(m){try{navigator.clipboard.writeText("aorkolaga@gmail.com").then(function(){var o="aorkolaga@gmail.com";m.textContent=o+" · "+COPIED[lang];clearTimeout(m._t);m._t=setTimeout(function(){m.textContent=o;},3000);},function(){});}catch(err){}return;}
    var a=e.target.closest("a.order");if(!a)return;
    var orig=a.getAttribute("data-label")||a.textContent;a.setAttribute("data-label",orig);
    try{navigator.clipboard.writeText("aitziber@puntu.eus").then(function(){a.textContent="aitziber@puntu.eus · "+COPIED[lang];clearTimeout(a._t);a._t=setTimeout(function(){a.textContent=orig;},3000);},function(){});}catch(err){}
  });
  var vlb=document.getElementById("vlb"),vlbV=document.getElementById("vlbV");
  function closeV(){vlb.classList.remove("open");document.body.style.overflow="";try{vlbV.pause();}catch(x){}vlbV.removeAttribute("src");vlbV.load();}
  document.getElementById("content").addEventListener("click",function(e){if(!e.target.closest(".vlink"))return;var w=works[views.indexOf(current())-3];if(!w||!w.video)return;
    vlbV.src=w.video;vlbV.poster=w.poster||"";document.getElementById("vlbC").textContent=w.vcap?w.vcap[lang]:"";vlb.classList.add("open");document.body.style.overflow="hidden";var pr=vlbV.play();if(pr&&pr.catch)pr.catch(function(){});document.getElementById("vlbX").focus();});
  document.getElementById("vlbX").addEventListener("click",closeV);
  vlb.addEventListener("click",function(e){if(e.target===vlb)closeV();});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&vlb.classList.contains("open"))closeV();});
  window.addEventListener("hashchange",function(){if(vlb.classList.contains("open"))closeV();});
  var st=null;document.addEventListener("scroll",function(){document.body.classList.add("scrolling");clearTimeout(st);st=setTimeout(function(){document.body.classList.remove("scrolling");},250);},{capture:true,passive:true});
  document.addEventListener("wheel",function(){document.body.classList.add("scrolling");clearTimeout(st);st=setTimeout(function(){document.body.classList.remove("scrolling");},250);},{passive:true});
  route(false);
})();
