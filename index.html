<head>

<title>Aitziber Orkolaga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --paper:#F5F5F3; --ink:#1B1B1A; --grey:#6E6E6A; --line:#CFCFCA; --ink-blue:#27358A;
  --mono:"Courier Prime","Courier New",Courier,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#171716;--ink:#E9E9E5;--grey:#9A9A94;--line:#3A3A37;--ink-blue:#9DB0FF}
}
:root[data-theme="dark"]{--paper:#171716;--ink:#E9E9E5;--grey:#9A9A94;--line:#3A3A37;--ink-blue:#9DB0FF}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.75 var(--mono);-webkit-font-smoothing:antialiased}
a,button{color:inherit;font:inherit}
a{text-decoration:underline;text-underline-offset:.25em;text-decoration-thickness:1px}
a:hover,button:hover{color:var(--ink-blue)}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink-blue);outline-offset:3px}
.layout{max-width:100rem;margin:0 auto;padding:2rem 1.5rem 3rem;display:grid;grid-template-columns:1fr;gap:2.5rem}
.side{display:flex;flex-direction:column;gap:1.5rem}
.name{font-weight:700;font-size:1.25rem;text-decoration:none;line-height:1.3}
nav{display:flex;flex-direction:row;flex-wrap:wrap;gap:.35rem 1.5rem}
nav a{text-decoration:none}
nav a:hover{text-decoration:underline}
nav a[aria-current="page"]{text-decoration:underline;font-weight:700}
.langs{display:flex;gap:1rem}
.langs button{background:none;border:0;padding:0;cursor:pointer;color:var(--grey)}
.langs button[aria-pressed="true"]{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:.25em}
.copy{color:var(--grey);font-size:.9375rem;margin-top:auto}
@media(min-width:900px){
  .layout{grid-template-columns:14rem 1fr;gap:3rem;padding-top:3rem;min-height:100vh}
  .side{position:sticky;top:3rem;align-self:start;min-height:calc(100vh - 6rem);gap:2rem}
  nav{flex-direction:column;gap:.3rem}
}
main{min-width:0}
.lead{font-size:clamp(1.125rem,2.2vw,1.4rem);line-height:1.5;max-width:36rem;margin:0 0 1.5rem;min-height:3em}
.cursor{display:inline-block;width:.6ch;height:1.05em;margin-left:2px;background:var(--ink);vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
.cursor.done{animation:none;opacity:0}
@keyframes blink{50%{opacity:0}}
.ph{display:flex;align-items:flex-end;padding:1rem;border:1px solid var(--line);background:color-mix(in srgb,var(--ink) 5%,var(--paper));color:var(--grey);font-size:.875rem;object-fit:cover;width:100%}
/* Para usar tus fotos: sustituye cada <div class="ph ..."> por <img class="ph ..." src="foto.jpg" alt="..."> */
.hero{display:grid;grid-template-columns:1fr;gap:.75rem;max-width:max(20rem,calc((100vh - 12rem)*2))}
.pair{display:grid;grid-template-columns:1fr 1fr}
.pair img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
h2{font-size:1.5rem;font-weight:700;margin:0 0 .25rem;line-height:1.35}
.meta{color:var(--grey);font-size:.9375rem;margin-bottom:2rem}
p{margin:0 0 1.25rem;max-width:36rem}
dl{margin:2.5rem 0 0;display:grid;grid-template-columns:5rem 1fr;gap:.6rem 1rem;max-width:36rem}
dt{color:var(--grey)}
dd{margin:0}
.grid{display:flex;gap:.75rem;overflow-x:auto;scroll-snap-type:x mandatory;margin:2rem 0;padding-bottom:.75rem;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.grid:focus-visible{outline:2px solid var(--ink-blue);outline-offset:3px}
.grid>*{min-width:0;flex:0 0 calc((100% - 1.5rem)/3);scroll-snap-align:start;aspect-ratio:2/3;height:auto;width:auto;max-width:none;object-fit:cover}
@media(max-width:600px){.grid>*{flex-basis:calc((100% - .75rem)/2)}}
.grid img{display:block;padding:0;border:0}
.grid .wide,.grid .tall{aspect-ratio:2/3}
.grid>.land{aspect-ratio:3/2;flex-basis:calc((100% - 1.5rem)/3*2.25)}
@media(max-width:600px){.grid>.land{flex-basis:100%}}
.grid>.pg{position:relative;aspect-ratio:var(--r,0.7577);flex-basis:calc((100% - 1.5rem)/3*1.5*var(--r,0.7577))}
.pg img{position:absolute;display:block;object-fit:cover}
@media(max-width:600px){.grid>.pg{flex-basis:calc((100% - .75rem)/2*1.5*var(--r,0.7577))}}
@media(prefers-reduced-motion:reduce){.cursor{animation:none}}
main img{cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2232%22%20height%3D%2232%22%3E%3Cg%20fill%3D%22none%22%20stroke-linecap%3D%22square%22%3E%3Cpath%20d%3D%22M16%206v20M6%2016h20%22%20stroke%3D%22%23fff%22%20stroke-opacity%3D%22.7%22%20stroke-width%3D%223%22/%3E%3Cpath%20d%3D%22M16%206v20M6%2016h20%22%20stroke%3D%22%2327358A%22%20stroke-width%3D%221.25%22/%3E%3C/g%3E%3C/svg%3E") 16 16,zoom-in}
body.scrolling main img,body.scrolling .gwrap{cursor:none}
.gwrap{position:relative}
.gwrap .grid{margin:0}
.gwrap{margin:2rem 0}
.arr{position:absolute;top:0;bottom:.75rem;width:4rem;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;cursor:pointer;opacity:0;transition:opacity .2s;color:#fff;filter:drop-shadow(0 0 2px rgba(0,0,0,.55)) drop-shadow(0 0 6px rgba(0,0,0,.35))}
.arr svg{width:2.5rem;height:1.1rem;stroke:currentColor;stroke-width:1.25;fill:none}
.arr.l{left:0}.arr.r{right:0}
.gwrap:hover .arr:not([hidden]),.gwrap.moving .arr:not([hidden]),.arr:focus-visible{opacity:1}
.arr[hidden]{display:none}
@media(hover:none){.arr{opacity:1}}
.lb{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:var(--paper);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.lb.open{display:flex}
.lb img{width:calc(100vw - 8rem);height:calc(100vh - 6rem);object-fit:contain;cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2232%22%20height%3D%2232%22%3E%3Cg%20fill%3D%22none%22%20stroke-linecap%3D%22square%22%3E%3Cpath%20d%3D%22M9%209l14%2014M23%209L9%2023%22%20stroke%3D%22%23fff%22%20stroke-opacity%3D%22.7%22%20stroke-width%3D%223%22/%3E%3Cpath%20d%3D%22M9%209l14%2014M23%209L9%2023%22%20stroke%3D%22%2327358A%22%20stroke-width%3D%221.25%22/%3E%3C/g%3E%3C/svg%3E") 16 16,pointer;display:block}
.lb button{position:absolute;background:none;border:0;padding:1rem;cursor:pointer;font-size:1.25rem;color:var(--ink)}
.lb .x{top:.5rem;right:.75rem}
.lb .prev{left:.5rem;top:50%;transform:translateY(-50%)}
.lb .next{right:.5rem;top:50%;transform:translateY(-50%)}
.lb .count{position:absolute;bottom:1rem;left:0;right:0;text-align:center;color:var(--grey);font-size:.875rem}
@media(max-width:600px){.lb img{width:100vw;height:calc(100vh - 7rem)}.lb .prev,.lb .next{top:auto;bottom:.25rem;transform:none}}

</style>
</head>

  var DESC={"inularre": {"eu": ["Bidaia bat, argazki lapurtuak eta maitasuna.", "Argazki liburu hau ez da opor batzuen kronika geografiko bat, bizitakoaren lekuko intimoa baizik. Kamerak, subjetuak ohartu gabe, haien egia biluziak eta keinu zaurgarriak harrapatu zituen, espazioa babesleku bihurtuz. Isiltasun berean topo egiten duten bi izate primitibo eta basati.", "Irudi lapurtu hauen azpian ardatz isil bat dago: maitasun gutun bat, maitatzea, norbaitek nola begiratzen zaituen ikastea ere badelako."], "es": ["Un viaje, fotografías robadas y amor.", "Este libro de fotografía no es una crónica geográfica de unas vacaciones, sino un testigo íntimo de lo vivido. La cámara, sin que los sujetos se dieran cuenta, captó su verdad desnuda y sus gestos vulnerables, convirtiendo el espacio en refugio. Dos seres primitivos y salvajes que se encuentran en un mismo silencio.", "Bajo estas imágenes robadas hay un eje silencioso: una carta de amor, porque amar también es aprender cómo te mira alguien."], "en": ["A journey, stolen photographs and love.", "This photobook is not a geographical chronicle of a holiday, but an intimate witness to what was lived. The camera, without the subjects noticing, caught their naked truth and vulnerable gestures, turning the space into a refuge. Two primitive and wild beings who meet in the same silence.", "Beneath these stolen images lies a silent axis: a love letter, because loving is also learning how someone looks at you."], "fr": ["Un voyage, des photographies volées et de l’amour.", "Ce livre de photographies n’est pas une chronique géographique de vacances, mais un témoin intime de ce qui a été vécu. L’appareil, à l’insu des sujets, a saisi leur vérité nue et leurs gestes vulnérables, faisant de l’espace un refuge. Deux êtres primitifs et sauvages qui se rencontrent dans un même silence.", "Sous ces images volées se trouve un axe silencieux : une lettre d’amour, car aimer, c’est aussi apprendre comment quelqu’un te regarde."]}};
